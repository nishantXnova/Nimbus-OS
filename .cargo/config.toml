[build]
target = "x86_64-nimbus_os.json"

[unstable]
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]
# Allow custom .json target specs without -Z flag on cargo invocation
# This makes `cargo bootimage` work on Rust 1.96+ where bootimage's inner `cargo build` would otherwise fail
json-target-spec = true

[target.'cfg(target_os = "none")']
runner = "bootimage run"
